name: Deploy Smokewatch

# Jalankan pipeline GFS lalu publish frontend+data ke GitHub Pages.
# Cron tiap 6 jam (menit :15). Bisa juga dipicu manual (workflow_dispatch).
on:
  # PEMICU PUSH JUGA DIMATIKAN selama masa penyiapan. Tanpa ini tiap commit
  # penggayaan ulang memicu masak 10 sampai 15 menit yang ujungnya gagal,
  # sebab GitHub Pages di repo ini belum disetel. Buang waktu dan bikin email
  # gagal beruntun. Buka lagi kalau sudah siap terbit.
  # push:
  #   branches: [main]
  # JADWAL DIBUKA 3 Sep 2026. Situsnya sudah terbit dan namanya sudah final,
  # jadi masa penyiapan selesai. Mulai sekarang menyegar sendiri tiap subuh.
  schedule:
    # 04:00 WIB = 21:00 UTC (hari sebelumnya). Sekali sehari.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write     # commit-back arsip harian (riwayat) ke repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Riwayat PENUH, bukan dangkal. Langkah arsip di bawah melakukan
          # rebase kalau main sudah maju, dan rebase di atas klona dangkal itu
          # rapuh. Repo ini cuma 3,8 MB dengan 58 commit, jadi murah.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # eccodes butuh pustaka C; wheel pip biasanya sudah membawa binernya,
      # tapi pasang libeccodes0 sistem sebagai jaring pengaman.
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Jalankan pipeline (unduh CAMS + render)
        working-directory: backend/pipeline
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}    # MAP_KEY NASA FIRMS untuk overlay titik api
        run: python run.py

      # Riwayat harian ditabung di repo (bukan cuma di artifact): output backend
      # gitignored & runner selalu checkout bersih, jadi tanpa commit-back arsip
      # tak pernah menumpuk. [skip ci] mencegah commit ini memicu deploy ulang.
      - name: Simpan arsip harian (riwayat) ke repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "peta-cuaca"
          git config user.email "peta-cuaca@users.noreply.github.com"
          git add frontend/data/arsip
          if git diff --cached --quiet; then
            echo "arsip tak berubah, lewati commit"
            exit 0
          fi
          git commit -m "Arsip harian kualitas udara [skip ci]"

          # Pipeline ini jalan 15 sampai 20 menit. Selama itu main BISA MAJU,
          # misalnya ada yang push perbaikan. Dulu push di sini polos tanpa
          # rebase, jadi begitu main maju dia ditolak "fetch first" dan SELURUH
          # deploy gagal padahal datanya sudah jadi. Kejadian 3 September 2026.
          # Diulang tiga kali, sebab main bisa maju lagi di sela percobaan.
          for i in 1 2 3; do
            if git push; then
              echo "arsip terkirim pada percobaan $i"
              exit 0
            fi
            echo "push ditolak, main sudah maju. Tarik ulang lalu coba lagi."
            git pull --rebase --autostash origin main || break
          done

          # Sengaja TIDAK menggagalkan build. Arsip riwayat itu pelengkap,
          # sedangkan penerbitan situs adalah tujuan utamanya. Jangan sampai
          # gagal menyimpan riwayat membuat peta hari ini batal terbit.
          echo "::warning::Commit-back arsip harian gagal setelah 3 percobaan. Datanya tetap ikut terbit ke Pages, cuma riwayatnya tidak tersimpan ke repo kali ini."


      # Keluaran disimpan ke cache supaya alur kerja Himawari bisa
      # memulihkannya lalu menerbitkan ulang SELURUH situs. Tanpa ini,
      # terbitan dari alur kerja itu akan menghapus keluaran CAMS, sebab
      # GitHub Pages mengganti seluruh situs tiap kali diterbitkan.
      # Polanya sama dengan yang sudah dipakai di repo Atmosight.
      - name: Simpan keluaran ke cache untuk alur kerja satelit
        uses: actions/cache/save@v4
        with:
          path: backend/data/output
          key: site-output-${{ github.run_id }}

      - name: Assemble site (jaga struktur ../backend/data/output)
        run: |
          mkdir -p _site/frontend _site/backend/data/output
          cp -r frontend/. _site/frontend/
          cp -r backend/data/output/. _site/backend/data/output/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Smokewatch, peta kualitas udara interaktif Indonesia</title>
          <script>location.replace("./frontend/index.html")</script>
          <meta http-equiv="refresh" content="0; url=./frontend/index.html">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="Smokewatch">
          <meta property="og:title" content="Smokewatch, peta kualitas udara interaktif Indonesia">
          <meta property="og:description" content="Sebaran PM2.5, PM10, CO, NO2, SO2, ozon, dan kabut asap untuk seluruh Indonesia. Klik lokasimu untuk grafik per jam.">
          <meta property="og:url" content="https://bungakertas-py.github.io/smokewatch/">
          <meta property="og:image" content="https://bungakertas-py.github.io/smokewatch/frontend/og-image.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://bungakertas-py.github.io/smokewatch/frontend/og-image.png">
          <style>html,body{margin:0;height:100%;background:#0a1018}</style>
          <a href="./frontend/index.html" style="position:absolute;left:-9999px">Buka Smokewatch</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
