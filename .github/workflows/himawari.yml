name: himawari-smokewatch

# Tiga layer PENGAMATAN untuk Smokewatch, True Color RGB, Brightness
# Temperature, dan Atmospheric Motion Vectors. CAMS itu model, dia
# menghitung polutan seharusnya ada di mana. Satelit menunjukkan keadaan
# yang sedang terjadi.
#
# PARAMETERNYA SAMA PERSIS dengan repo Atmosight, atas permintaan pemilik,
# dan berkas pipeline-nya memang salinan dari sana. Dust RGB dan Active
# Fire Detection dibuang bersamaan dengan itu.
#
# POLANYA SAMA dengan alur kerja satelit di repo Atmosight. Keluaran situs
# terakhir dipulihkan dari cache, bagian satelit diperbarui, lalu situsnya
# diterbitkan ulang. Tanpa itu terbitan dari sini akan MENGHAPUS keluaran
# CAMS, sebab GitHub Pages mengganti seluruh situs tiap kali diterbitkan.
on:
  schedule:
    # ENAM KALI SEHARI, dan sejak irama jadi sepuluh menit tiap jalan
    # memang punya pekerjaan, bukan sekadar memeriksa lalu berhenti.
    #
    # Jarak terbesar antar jalan di jadwal ini delapan jam, yaitu 48 slot
    # baru, dan jatah tiap jalan 60 slot. Jadi deretnya selalu terkejar.
    # Kalau jadwalnya nanti dirapatkan, jatahnya boleh ikut diturunkan.
    #
    # Dicoba berkali kali sebab jadwal GitHub Actions sering telat, kadang
    # tiga sampai lima jam waktu pelayanannya sibuk.
    - cron: "15 5,7,9,12,16,21 * * *"
  workflow_dispatch:
    inputs:
      jatah:
        description: "Batas slot baru yang dimasak satu jalan, kosongkan untuk 60"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  masak:
    runs-on: ubuntu-latest
    # Terukur 21 Oktober 2026, satu slot sekitar 1,6 menit termasuk
    # mengunduh 19 MB segmen inframerah. Jatah 60 slot berarti sekitar 96
    # menit, jadi 300 menit memberi ruang lebar tanpa menyentuh batas 360
    # menit GitHub Actions.
    timeout-minutes: 300
    outputs:
      berubah: ${{ steps.masak.outputs.berubah }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang pustaka
        run: pip install --quiet numpy Pillow

      - name: Pulihkan keluaran situs dari cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data/output
          key: site-output-none
          restore-keys: |
            site-output-

      - name: Masak citra satelit
        id: masak
        env:
          HIMAWARI_JATAH: ${{ inputs.jatah }}
        run: |
          # Katalog CAMS duduk di AKAR keluaran, bukan di subfolder cams.
          # Penjagaan yang menunjuk subfolder tidak pernah terpenuhi walau
          # cache-nya sudah pulih 185 MB, dan alur kerjanya berhenti terus
          # dengan alasan yang salah. Susunan ini sama dengan repo Atmosight,
          # akar untuk model global dan subfolder untuk yang lain.
          if [ ! -f backend/data/output/catalog.json ]; then
            echo "cache keluaran belum ada, lewati, deploy utama tetap jalan"
            echo "berubah=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Yang dibandingkan ISI berkasnya, bukan daftar namanya, supaya
          # perbaikan cara menggambar pada bingkai yang namanya sama ikut
          # terdeteksi dan terbit.
          sebelum=$(cat backend/data/output/himawari/* 2>/dev/null | md5sum)
          python backend/pipeline/himawari_run.py
          sesudah=$(cat backend/data/output/himawari/* 2>/dev/null | md5sum)
          if [ "$sebelum" = "$sesudah" ]; then
            echo "tidak ada yang baru, tidak diterbitkan ulang"
            echo "berubah=false" >> "$GITHUB_OUTPUT"
          else
            echo "berubah=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Simpan keluaran ke cache
        if: steps.masak.outputs.berubah == 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/data/output
          key: site-output-${{ github.run_id }}

      - name: Rakit situs, jaga struktur ../backend/data/output
        if: steps.masak.outputs.berubah == 'true'
        run: |
          mkdir -p _site/frontend _site/backend/data/output
          cp -r frontend/. _site/frontend/
          cp -r backend/data/output/. _site/backend/data/output/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Smokewatch, peta kualitas udara interaktif Indonesia</title>
          <meta http-equiv="refresh" content="0; url=./frontend/index.html">
          <a href="./frontend/index.html">Buka Smokewatch</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        if: steps.masak.outputs.berubah == 'true'
        with:
          path: _site

  terbit:
    needs: masak
    if: needs.masak.outputs.berubah == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
